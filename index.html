<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container" id="container">
    <h2>Calculadora de Precios</h2>

    <form id="priceForm">
      <div class="field">
        <label for="costo">Costo</label>
        <input type="number" id="costo" placeholder="Precio Costo" required>
      </div>

      <div class="field">
        <label for="porcentaje">Porcentaje de ganancia (%)</label>
        <input type="number" id="porcentaje" placeholder="Porcentaje de Ganancia" required>
      </div>

      <div class="field">
        <label for="adicionales">Costos adicionales</label>
        <input type="number" id="adicionales" placeholder="Ej: Envio">
      </div>

      <div class="field">
        <label for="impuestos">Impuestos (%)</label>
        <input type="number" id="impuestos" placeholder="Ej: IVA">
      </div>

      <button id="btn-calcular" type="button">Calcular</button>
    </form>
  </div>
</body>
<script src="mains.js"></script>

</html>
